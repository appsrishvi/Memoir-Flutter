<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memoir</title>
    <meta name="description" content="Memoir, a private mood-reactive journal. App guide and privacy policy." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>:root{--paper:#fdfbf7;--surface:#fff;--ink:#1f2937;--muted:#6b7280;--line:#e7dfd2;--plum:#5b21b6;--plum-soft:#ede9fe;--shadow:0 12px 34px #1f29371a}@media (prefers-color-scheme:dark){:root{--paper:#17151d;--surface:#241f31;--ink:#f5f0e8;--muted:#c7bfd4;--line:#3b3350;--plum-soft:#3a2b66;--shadow:0 12px 34px #00000059}}*{box-sizing:border-box}body{background:var(--paper);min-height:100vh;color:var(--ink);place-items:center;margin:0;padding:40px 16px;font-family:Public Sans,ui-sans-serif,system-ui,-apple-system,sans-serif;display:grid}main{text-align:center;width:100%;max-width:640px}.mark{background:var(--plum);color:#fff;border-radius:999px;place-items:center;width:52px;height:52px;margin:0 auto 18px;display:grid}h1{letter-spacing:-.03em;margin:0;font-family:Fraunces,Georgia,serif;font-size:clamp(2.4rem,8vw,3.4rem);font-weight:600;line-height:1}.lede{max-width:46ch;color:var(--muted);margin:14px auto 32px;line-height:1.7}.links{text-align:left;grid-template-columns:1fr;gap:14px;display:grid}@media (width>=560px){.links{grid-template-columns:1fr 1fr}}a.card{border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);color:inherit;border-radius:22px;padding:22px;text-decoration:none;transition:transform .15s,border-color .15s;display:block}a.card:hover,a.card:focus-visible{border-color:var(--plum);transform:translateY(-2px)}.kicker{letter-spacing:.2em;text-transform:uppercase;color:var(--plum);font-size:11px;font-weight:700}@media (prefers-color-scheme:dark){.kicker{color:#c4b5fd}}.card h2{margin:8px 0 6px;font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:600}.card p{color:var(--muted);margin:0;font-size:14px;line-height:1.6}footer{color:var(--muted);margin-top:36px;font-size:13px}</style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
      </div>
      <h1>Memoir</h1>
      <p class="lede">A private, mood-reactive journal and photo diary. Your words stay yours.</p>
      <div class="links">
        <a class="card" href="./guide/">
          <span class="kicker">Guide</span>
          <h2>App Guide</h2>
          <p>How to use Memoir and how it works.</p>
        </a>
        <a class="card" href="./privacy-policy/">
          <span class="kicker">Legal</span>
          <h2>Privacy Policy</h2>
          <p>What Memoir collects, why, and the control you keep.</p>
        </a>
      </div>
      <footer>© 2026 Memoir</footer>
    </main>
  </body>
</html>
